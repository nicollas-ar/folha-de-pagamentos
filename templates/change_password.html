{% extends 'base.html' %}
{% block title %}Trocar senha · Folha Clara{% endblock %}
{% block content %}
<section class="page-heading"><div><span class="eyebrow">SEGURANÇA DA CONTA</span><h1>Defina uma nova senha</h1><p>A senha inicial deve ser substituída antes de acessar as demais telas.</p></div></section>
<form method="post" class="card form-card narrow"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Nova senha (15 a 128 caracteres)<input type="password" name="password" minlength="15" maxlength="128" required autocomplete="new-password"></label><label>Confirme a nova senha<input type="password" name="confirmation" minlength="15" maxlength="128" required autocomplete="new-password"></label><button class="button primary" type="submit">Atualizar senha</button></form>
{% endblock %}
